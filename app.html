<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F9FAFC" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#06090F" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@500;600&display=swap">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Royal Cita">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<title>Royal Cita IA</title>
<style>
/* Mismos tokens que Royal Sales IA (app/globals.css), convertidos a hex */
:root{
  --fondo:#F9FAFC; --tarjeta:#FFFFFF; --tinta:#0C0F16; --suave:#666C78; --linea:#E4E5E8; --muted:#F3F4F7;
  --primario:#2759D6; --primario-suave:#EEF2FA; --primario-tinta:#212D47;
  --exito:#0FA05C; --aviso:#DF911A; --aviso-suave:#FCF1E0; --aviso-tinta:#5A3A05; --peligro:#DF202E; --menu:#060A13;
  --burbuja-cliente:#FFFFFF; --burbuja-bot:#EEF2FA; --burbuja-tu:#2759D6; --tinta-tu:#FFFFFF;
  --radio:14px; --radio-sm:10px;
  --arriba:env(safe-area-inset-top); --abajo:env(safe-area-inset-bottom);
  --sans:"Geist",ui-sans-serif,-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  --mono:"Geist Mono",ui-monospace,"SF Mono",Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root{
  --fondo:#06090F; --tarjeta:#0E121A; --tinta:#F3F5F9; --suave:#9298A5; --linea:rgba(255,255,255,.10); --muted:#1A1F29;
  --primario:#457CFD; --primario-suave:#1D2433; --primario-tinta:#DCE5FF;
  --exito:#32B36E; --aviso:#F4A437; --aviso-suave:rgba(244,164,55,.13); --aviso-tinta:#F8D49A; --peligro:#F14D4C;
  --burbuja-cliente:#1A1F29; --burbuja-bot:#1D2433; --burbuja-tu:#457CFD;
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;background:var(--fondo);color:var(--tinta)}
body{font:16px/1.45 var(--sans);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,a:focus-visible,textarea:focus-visible{outline:2px solid var(--primario);outline-offset:2px;border-radius:8px}
a{color:inherit}

/* --- estructura --- */
#vista{max-width:760px;margin:0 auto;padding:calc(var(--arriba) + 10px) 16px calc(var(--abajo) + 96px)}
.marca{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:4px 0 14px;margin:0 -16px 0;padding-left:16px;padding-right:16px;border-bottom:1px solid var(--linea)}
.marca .logo{display:flex;align-items:center;gap:10px;min-width:0}
.marca img{width:32px;height:32px;border-radius:22%;flex:none}
.marca b{display:block;font-size:15px;font-weight:600;line-height:1.15;letter-spacing:-.01em}
.marca small{display:block;font-size:12px;color:var(--suave);line-height:1.2}
.titulo{margin:26px 0 18px}
.titulo h1{font-size:30px;line-height:1.1;letter-spacing:-.025em;margin:0;font-weight:700}
.titulo p{margin:8px 0 0;color:var(--suave);font-size:16px;max-width:52ch}
.seccion{font-size:17px;font-weight:600;letter-spacing:-.01em;margin:28px 0 10px}
.suave{color:var(--suave)}
.pequeno{font-size:13px}

/* conexión */
.estado-wa{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:500;padding:5px 10px;border-radius:99px;background:var(--tarjeta);border:1px solid var(--linea);text-decoration:none;white-space:nowrap}
.punto{width:7px;height:7px;border-radius:50%;background:currentColor;flex:none}
.ok{color:var(--exito)} .alerta{color:var(--peligro)} .espera{color:var(--aviso)}

/* "te toca a ti" — lo que pide atención */
.te-toca{background:var(--aviso-suave);border:1px solid color-mix(in srgb,var(--aviso) 35%,transparent);border-radius:var(--radio);padding:16px 16px 6px;margin-bottom:12px}
.te-toca h2{margin:0 0 2px;font-size:17px;font-weight:600;color:var(--aviso-tinta)}
.te-toca p{margin:0 0 8px;font-size:13px;color:var(--aviso-tinta);opacity:.85}
.te-toca .fila{border-top:1px solid color-mix(in srgb,var(--aviso) 25%,transparent);padding-left:0;padding-right:0}
.tranquilo{border-radius:var(--radio);padding:16px;background:var(--tarjeta);border:1px solid var(--linea);margin-bottom:12px}
.tranquilo h2{margin:0 0 2px;font-size:17px;font-weight:600}

/* tarjetas de métricas (como el Centro de mando) */
.metricas{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:0 0 4px}
.metrica{background:var(--tarjeta);border:1px solid var(--linea);border-radius:var(--radio);padding:16px}
.metrica span{display:block;font-size:13px;color:var(--suave)}
.metrica b{display:block;font:600 28px/1.15 var(--mono);letter-spacing:-.02em;margin-top:6px;font-variant-numeric:tabular-nums}
.metrica small{display:block;font-size:13px;color:var(--suave);margin-top:4px;line-height:1.3}

/* listas */
.lista{background:var(--tarjeta);border:1px solid var(--linea);border-radius:var(--radio);overflow:hidden}
.fila{display:flex;align-items:center;gap:12px;padding:12px 14px;width:100%;text-align:left;text-decoration:none;color:inherit}
.lista .fila+.fila{border-top:1px solid var(--linea)}
.avatar{width:40px;height:40px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:600;font-size:15px;background:var(--primario-suave);color:var(--primario)}
.te-toca .avatar{background:var(--tarjeta);color:var(--aviso-tinta)}
.cuerpo{flex:1;min-width:0}
.linea1{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.nombre{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hora{font-size:12px;color:var(--suave);flex:none;font-family:var(--mono)}
.prev{font-size:14px;color:var(--suave);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;gap:6px;align-items:center}
.te-toca .prev{color:var(--aviso-tinta);opacity:.85}
.zona-tag{flex:none;font-size:11px;font-weight:500;line-height:1;padding:4px 8px;border-radius:99px;background:var(--primario-suave);color:var(--primario);margin-left:6px;white-space:nowrap}
.filtros.zonas{margin-top:-6px}
.vacio{padding:22px 18px;color:var(--suave);text-align:center;font-size:14px}

/* filtros */
.filtros{display:flex;gap:8px;overflow-x:auto;margin:0 -16px 14px;padding:0 16px;scrollbar-width:none}
.filtros::-webkit-scrollbar{display:none}
.chip{flex:none;padding:7px 13px;border-radius:99px;background:var(--tarjeta);border:1px solid var(--linea);font-size:14px;font-weight:500;color:var(--suave)}
.chip[aria-pressed="true"]{background:var(--primario);border-color:var(--primario);color:#fff}
.chip .n{opacity:.75;margin-left:5px;font-family:var(--mono);font-size:12px}

/* citas */
.cita{display:flex;gap:14px;padding:14px}
.lista .cita+.cita{border-top:1px solid var(--linea)}
.cita .dia{width:52px;flex:none;text-align:center;border-radius:var(--radio-sm);background:var(--muted);padding:6px 0;align-self:flex-start}
.cita .dia small{display:block;font-size:11px;color:var(--suave);text-transform:capitalize}
.cita .dia b{display:block;font:600 20px/1.15 var(--mono)}
.cita .acciones{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.boton{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:8px 13px;border-radius:var(--radio-sm);font-weight:500;font-size:14px;background:var(--tarjeta);border:1px solid var(--linea);text-decoration:none;white-space:nowrap}
.boton.principal{background:var(--primario);border-color:var(--primario);color:#fff}
.boton.peligro{color:var(--peligro)}

/* ajustes */
.ajuste{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:14px 16px}
.lista .ajuste+.ajuste{border-top:1px solid var(--linea)}
.interruptor{width:46px;height:28px;border-radius:99px;background:var(--linea);position:relative;flex:none;transition:background .2s}
.interruptor::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s}
.interruptor[aria-checked="true"]{background:var(--primario)}
.interruptor[aria-checked="true"]::after{transform:translateX(18px)}
.codigo{font:600 32px/1.1 var(--mono);letter-spacing:.08em;text-align:center;padding:14px 0;color:var(--primario)}
.pasos{margin:0;padding:0 16px 14px 36px;color:var(--suave);font-size:14px}
.pasos li{margin:4px 0}

/* barra de pestañas */
.pestanas{position:fixed;left:0;right:0;bottom:0;z-index:5;display:flex;justify-content:center;background:color-mix(in srgb,var(--tarjeta) 92%,transparent);backdrop-filter:saturate(1.6) blur(18px);-webkit-backdrop-filter:saturate(1.6) blur(18px);border-top:1px solid var(--linea);padding-bottom:var(--abajo)}
.pestanas a{flex:1;max-width:180px;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0 6px;font-size:11px;font-weight:500;color:var(--suave);text-decoration:none;position:relative}
.pestanas a[aria-current="page"]{color:var(--primario)}
.pestanas svg{width:24px;height:24px}
.insignia{position:absolute;top:3px;left:calc(50% + 6px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--primario);color:#fff;font:600 11px/18px var(--mono);text-align:center}

/* chat */
.chat-cabeza{position:sticky;top:0;z-index:4;margin:calc(-1 * (var(--arriba) + 10px)) -16px 8px;padding:calc(var(--arriba) + 8px) 8px 10px;background:color-mix(in srgb,var(--fondo) 92%,transparent);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-bottom:1px solid var(--linea)}
.chat-top{display:flex;align-items:center;gap:8px}
.chat-cabeza .aviso-estado{margin:8px 8px 0}
.atras{display:flex;align-items:center;gap:2px;font-weight:500;color:var(--primario);padding:8px;text-decoration:none}
.chat-top .cuerpo{text-align:center}
.chat-top .nombre{font-size:16px}
.mas{padding:8px 10px;font-size:20px;line-height:1;color:var(--suave)}
.aviso-estado{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:12px 0;padding:10px 12px 10px 14px;border-radius:var(--radio);background:var(--tarjeta);border:1px solid var(--linea);font-size:14px}
.aviso-estado.humano{background:var(--aviso-suave);border-color:color-mix(in srgb,var(--aviso) 35%,transparent);color:var(--aviso-tinta)}
.mensajes{display:flex;flex-direction:column;gap:6px;padding-bottom:8px}
.dia-sep{align-self:center;font-size:12px;color:var(--suave);background:var(--tarjeta);border:1px solid var(--linea);padding:3px 10px;border-radius:99px;margin:10px 0 4px}
.msg{max-width:82%;padding:8px 12px 6px;border-radius:16px;white-space:pre-wrap;word-wrap:break-word;font-size:15px;line-height:1.4}
.msg.cliente{align-self:flex-start;background:var(--burbuja-cliente);border:1px solid var(--linea);border-bottom-left-radius:5px}
.msg.bot{align-self:flex-end;background:var(--burbuja-bot);border-bottom-right-radius:5px}
.msg.tomas{align-self:flex-end;background:var(--burbuja-tu);color:var(--tinta-tu);border-bottom-right-radius:5px}
.msg .meta{display:block;text-align:right;font:11px var(--mono);color:var(--suave);margin-top:3px}
.msg.tomas .meta{color:rgba(255,255,255,.75)}
.msg .quien{font-size:11px;font-weight:600;margin-bottom:1px;display:block}
.msg.bot .quien{color:var(--primario)} .msg.tomas .quien{color:rgba(255,255,255,.85)}
.redactar{position:fixed;left:0;right:0;bottom:0;z-index:5;background:color-mix(in srgb,var(--tarjeta) 94%,transparent);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-top:1px solid var(--linea);padding:8px 12px calc(var(--abajo) + 8px)}
.redactar form{max-width:760px;margin:0 auto;display:flex;gap:8px;align-items:flex-end}
.redactar textarea{flex:1;resize:none;font:inherit;font-size:16px;line-height:1.35;max-height:140px;padding:9px 14px;border-radius:20px;border:1px solid var(--linea);background:var(--fondo);color:var(--tinta)}
.enviar{width:40px;height:40px;border-radius:50%;background:var(--primario);color:#fff;display:grid;place-items:center;flex:none}
.enviar:disabled{opacity:.35}
.redactar .nota{max-width:760px;margin:0 auto 6px;font-size:12px;color:var(--suave);text-align:center}

/* hoja de acciones */
.hoja-fondo{position:fixed;inset:0;z-index:10;background:rgba(6,10,19,.45);display:flex;align-items:flex-end;justify-content:center}
.hoja{width:100%;max-width:520px;margin:0 8px calc(var(--abajo) + 8px);display:flex;flex-direction:column;gap:8px}
.hoja .grupo{background:var(--tarjeta);border-radius:var(--radio);overflow:hidden}
.hoja button,.hoja a{display:block;width:100%;padding:15px;text-align:center;font-size:17px;color:var(--primario);text-decoration:none}
.hoja .grupo>*+*{border-top:1px solid var(--linea)}
.hoja .rojo{color:var(--peligro)!important}
.hoja .cancelar{font-weight:600}

.toast{position:fixed;left:50%;bottom:calc(var(--abajo) + 90px);transform:translateX(-50%);background:var(--menu);color:#fff;padding:10px 16px;border-radius:var(--radio-sm);font-size:14px;z-index:20;max-width:90vw}
@media (prefers-color-scheme:dark){.toast{background:var(--primario)}}
@media (min-width:700px){.metricas{grid-template-columns:repeat(4,1fr)}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main id="vista" aria-live="polite"></main>
<nav class="pestanas" id="pestanas" aria-label="Secciones">
  <a href="#/inicio" data-tab="inicio"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Hoy</a>
  <a href="#/chats" data-tab="chats"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20.5l1.4-4.6A8 8 0 1 1 21 12z"/></svg>Chats<span class="insignia" id="insignia" hidden></span></a>
  <a href="#/citas" data-tab="citas"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>Citas</a>
  <a href="#/ajustes" data-tab="ajustes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2.2"/><circle cx="10" cy="17" r="2.2"/></svg>Ajustes</a>
</nav>
<div id="capa"></div>

<script>
(() => {
  'use strict'
  const $ = (s, el = document) => el.querySelector(s)
  const vista = $('#vista')
  const capa = $('#capa')
  let estado = null
  let zona = 'America/Chicago'
  let filtro = 'todos'
  let filtroZona = 'todas'
  let firmaChat = ''

  // ---------- utilidades ----------
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]))
  const fmt = (opts) => new Intl.DateTimeFormat('es', { timeZone: zona, ...opts })
  const diaClave = (d) => fmt({ year: 'numeric', month: '2-digit', day: '2-digit' }).format(d)
  function horaCorta (t) {
    if (!t) return ''
    const d = new Date(t), hoy = new Date(), ayer = new Date(Date.now() - 864e5)
    if (diaClave(d) === diaClave(hoy)) return fmt({ hour: 'numeric', minute: '2-digit' }).format(d)
    if (diaClave(d) === diaClave(ayer)) return 'Ayer'
    return fmt({ day: 'numeric', month: 'short' }).format(d)
  }
  const soloHora = (t) => fmt({ hour: 'numeric', minute: '2-digit' }).format(new Date(t))
  const diaLargo = (t) => {
    const d = new Date(t)
    if (diaClave(d) === diaClave(new Date())) return 'Hoy'
    if (diaClave(d) === diaClave(new Date(Date.now() - 864e5))) return 'Ayer'
    return fmt({ weekday: 'long', day: 'numeric', month: 'long' }).format(d)
  }
  const nombreDe = (c) => c.nombre || (c.telefono ? '+' + c.telefono : 'Sin nombre')
  const inicial = (c) => (c.nombre || '#').trim().charAt(0).toUpperCase() || '#'
  const ETIQUETA = {
    prospecto: ['Bot contestando', 'ok'],
    pausado: ['En pausa', 'espera'],
    humano: ['Te toca a ti', 'alerta'],
    pide_info: ['Pide información', 'alerta'],
    conocido: ['Ignorado', 'suave']
  }

  async function api (ruta, cuerpo) {
    const op = cuerpo ? { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(cuerpo) } : {}
    const r = await fetch(ruta, { ...op, credentials: 'same-origin', cache: 'no-store' })
    if (r.status === 401) { location.href = '/'; throw new Error('Sin sesión') }
    const j = await r.json().catch(() => ({}))
    if (!r.ok) throw new Error(j.error || 'Error ' + r.status)
    return j
  }

  function aviso (texto) {
    const t = document.createElement('div')
    t.className = 'toast'; t.textContent = texto; t.setAttribute('role', 'status')
    document.body.appendChild(t)
    setTimeout(() => t.remove(), 2600)
  }

  function hoja (opciones) {
    capa.innerHTML = `<div class="hoja-fondo" id="hf"><div class="hoja" role="dialog" aria-modal="true">
      <div class="grupo">${opciones.map((o, i) => o.href
        ? `<a href="${esc(o.href)}" target="_blank" rel="noopener">${esc(o.texto)}</a>`
        : `<button data-i="${i}" class="${o.rojo ? 'rojo' : ''}">${esc(o.texto)}</button>`).join('')}</div>
      <div class="grupo"><button class="cancelar" data-cerrar>Cancelar</button></div></div></div>`
    const cerrar = () => { capa.innerHTML = '' }
    $('#hf').addEventListener('click', (e) => {
      if (e.target.id === 'hf' || e.target.hasAttribute('data-cerrar')) return cerrar()
      const i = e.target.getAttribute('data-i')
      if (i != null) { cerrar(); opciones[+i].accion() }
    })
  }

  function filaChat (c) {
    const [et, cl] = ETIQUETA[c.estado] || ['', 'suave']
    const u = c.ultimo
    const quien = u ? (u.rol === 'bot' ? 'Bot: ' : u.rol === 'tomas' ? 'Tú: ' : '') : ''
    return `<a class="fila" href="#/chat/${encodeURIComponent(c.id)}">
      <span class="avatar" aria-hidden="true">${esc(inicial(c))}</span>
      <span class="cuerpo">
        <span class="linea1"><span style="display:flex;align-items:center;min-width:0"><span class="nombre">${esc(nombreDe(c))}</span>${c.zonaNombre ? `<span class="zona-tag">${esc(c.zonaNombre)}</span>` : ''}</span><span class="hora">${esc(horaCorta(c.actualizado))}</span></span>
        <span class="prev"><span class="punto ${cl}" title="${esc(et)}"></span><span style="overflow:hidden;text-overflow:ellipsis">${esc(quien + (u ? u.texto : 'Sin mensajes'))}</span></span>
      </span></a>`
  }

  /** Estado de confirmación de la cita (recordatorio del día anterior) */
  function estadoCita (c) {
    if (c.confirmacion === 'confirmada') return ' · <span class="ok">Confirmada</span>'
    if (c.recordatorio?.avisoSinRespuesta) return ' · <span class="alerta">No ha confirmado</span>'
    if (c.recordatorio) return ' · <span class="espera">Recordatorio enviado</span>'
    return ''
  }

  function filaCita (c) {
    const d = new Date(c.inicio)
    // la cita se muestra en la hora local de su zona (si es de otro estado, se aclara)
    const tzCita = c.tzCliente || c.zonaHoraria || zona
    const f = (o) => new Intl.DateTimeFormat('es', { timeZone: tzCita, ...o }).format(d)
    const otraHora = tzCita !== zona
    return `<div class="cita">
      <div class="dia"><small>${esc(f({ weekday: 'short' }))}</small><b>${esc(f({ day: 'numeric' }))}</b><small>${esc(f({ month: 'short' }))}</small></div>
      <div class="cuerpo">
        <div class="linea1"><span style="display:flex;align-items:center;min-width:0"><span class="nombre">${esc(c.nombre)}</span>${c.zonaNombre ? `<span class="zona-tag">${esc(c.zonaNombre)}</span>` : ''}</span><span class="hora">${esc(f({ hour: 'numeric', minute: '2-digit' }))}${otraHora ? ' local' : ''}</span></div>
        ${c.atiende && c.atiende !== 'Tomás' ? `<div class="suave pequeno">Atiende ${esc(c.atiende)}</div>` : ''}
        <div class="suave pequeno">${c.modalidad === 'meet' ? '📹 Google Meet' : esc(c.direccion)}${estadoCita(c)}</div>
        ${c.notas ? `<div class="suave pequeno">${esc(c.notas)}</div>` : ''}
        <div class="acciones">
          ${c.chatId ? `<a class="boton" href="#/chat/${encodeURIComponent(c.chatId)}">Ver chat</a>` : ''}
          ${c.telefono ? `<a class="boton" href="https://wa.me/${esc(c.telefono)}" target="_blank" rel="noopener">WhatsApp</a>` : ''}
          ${c.modalidad === 'meet'
            ? (c.meetEnlace ? `<a class="boton" href="${esc(c.meetEnlace)}" target="_blank" rel="noopener">Abrir Meet</a>` : '')
            : `<a class="boton" href="https://maps.apple.com/?q=${encodeURIComponent(c.direccion)}" target="_blank" rel="noopener">Cómo llegar</a>`}
        </div>
      </div></div>`
  }

  function pastillaWA () {
    if (!estado) return ''
    if (estado.wa.conectado) return '<span class="estado-wa ok"><span class="punto"></span>Conectado</span>'
    if (estado.wa.codigo || estado.wa.qr) return '<a class="estado-wa alerta" href="#/ajustes"><span class="punto"></span>Falta vincular</a>'
    return '<span class="estado-wa espera"><span class="punto"></span>Conectando…</span>'
  }

  /** Barra con el logo (como Royal Sales IA) + título y subtítulo de la pantalla */
  function cabecera (titulo, subtitulo) {
    return `<div class="marca"><div class="logo"><img src="/apple-touch-icon.png" alt=""><div><b>Royal Cita IA</b><small>Asistente: Sofía</small></div></div>${pastillaWA()}</div>
      <header class="titulo"><h1>${esc(titulo)}</h1>${subtitulo ? `<p>${esc(subtitulo)}</p>` : ''}</header>`
  }

  // ---------- vistas ----------
  async function verInicio () {
    estado = await api('/api/estado'); zona = estado.zona || zona
    const r = estado.resumen
    const pend = estado.pendientes
    vista.innerHTML = `
      ${cabecera('Hoy', 'Lo que está pasando con tus prospectos de WhatsApp.')}
      ${!estado.botActivo ? '<div class="aviso-estado"><span>El bot está apagado y no contesta a nadie.</span><button class="boton principal" data-bot="on">Encender</button></div>' : ''}
      ${pend.length
        ? `<section class="te-toca"><h2>${pend.length === 1 ? '1 persona te espera' : pend.length + ' personas te esperan'}</h2>
            <p>${pend.some(c => c.estado === 'pide_info') ? 'Respóndeles tú o deja que el bot los atienda.' : 'El bot les pasó la conversación a ti.'}</p>
            ${pend.map(filaChat).join('')}</section>`
        : `<section class="tranquilo"><h2>Nadie te está esperando</h2>
            <div class="suave">${estado.botActivo ? 'El bot está atendiendo a los prospectos.' : 'Enciende el bot para que atienda a los prospectos.'}</div></section>`}
      <div class="metricas">
        <div class="metrica"><span>Prospectos hoy</span><b>${r.prospectosHoy}</b><small>Escribieron por campañas</small></div>
        <div class="metrica"><span>Esta semana</span><b>${r.prospectosSemana}</b><small>Prospectos nuevos</small></div>
        <div class="metrica"><span>Citas agendadas</span><b>${r.citasSemana}</b><small>Por el bot esta semana</small></div>
        <div class="metrica"><span>Próximas citas</span><b>${r.citasProximas}</b><small>Demostraciones por venir</small></div>
      </div>
      <h2 class="seccion">Próximas citas</h2>
      <div class="lista">${estado.proximas.length ? estado.proximas.map(filaCita).join('') : '<div class="vacio">Cuando el bot agende una demostración, aparecerá aquí.</div>'}</div>`
    insignia()
  }

  async function verChats () {
    const { chats } = await api('/api/chats')
    const cuenta = (f) => chats.filter(f).length
    const filtros = [
      ['todos', 'Todos', () => true],
      ['humano', 'Te toca', c => c.estado === 'humano'],
      ...(chats.some(c => c.estado === 'pide_info') ? [['pide_info', 'Pide info', c => c.estado === 'pide_info']] : []),
      ['prospecto', 'Bot', c => c.estado === 'prospecto'],
      ['pausado', 'En pausa', c => c.estado === 'pausado']
    ]
    const actual = filtros.find(f => f[0] === filtro) || filtros[0]
    const zonas = [...new Set(chats.map(c => c.zonaNombre).filter(Boolean))]
    const hayZona = (c) => filtroZona === 'todas' || (filtroZona === 'sin' ? !c.zonaNombre : c.zonaNombre === filtroZona)
    if (filtroZona !== 'todas' && filtroZona !== 'sin' && !zonas.includes(filtroZona)) filtroZona = 'todas'
    const lista = chats.filter(actual[2]).filter(hayZona)
    const chipsZona = zonas.length
      ? `<div class="filtros zonas" role="group" aria-label="Filtrar por zona">
          ${[['todas', 'Todas las zonas'], ...zonas.map(z => [z, z]), ...(chats.some(c => !c.zonaNombre) ? [['sin', 'Sin zona']] : [])]
            .map(([k, t]) => `<button class="chip" data-zona="${esc(k)}" aria-pressed="${k === filtroZona}">${esc(t)}</button>`).join('')}
        </div>`
      : ''
    vista.innerHTML = `
      ${cabecera('Chats', 'Conversaciones que atiende Sofía.')}
      <div class="filtros" role="group" aria-label="Filtrar chats">
        ${filtros.map(([k, t, f]) => `<button class="chip" data-filtro="${k}" aria-pressed="${k === filtro}">${t}<span class="n">${cuenta(f)}</span></button>`).join('')}
      </div>
      ${chipsZona}
      <div class="lista">${lista.length ? lista.map(filaChat).join('') : `<div class="vacio">${filtro === 'todos' ? 'Cuando alguien escriba desde un anuncio, su chat aparecerá aquí.' : 'No hay chats en este grupo.'}</div>`}</div>`
  }

  async function verChat (id, refresco) {
    let datos
    try { datos = await api('/api/chat?id=' + encodeURIComponent(id)) } catch (e) {
      vista.innerHTML = `<p><a class="atras" href="#/chats">‹ Chats</a></p><div class="vacio">Este chat ya no existe.</div>`; return
    }
    const c = datos.chat
    const firma = c.estado + '|' + c.historial.length + '|' + (c.historial.at(-1)?.t || 0)
    if (refresco && firma === firmaChat) return
    firmaChat = firma

    const borrador = $('#texto')?.value || ''
    const escribiendo = document.activeElement?.id === 'texto'
    const pegadoAbajo = !refresco || (innerHeight + scrollY >= document.body.scrollHeight - 120)

    let avisoEstado = ''
    if (c.estado === 'prospecto') avisoEstado = `<div class="aviso-estado"><span><span class="punto ok" style="display:inline-block;margin-right:6px"></span>El bot está contestando</span><button class="boton" data-chat-accion="pausar">Pausar</button></div>`
    else if (c.estado === 'pausado') avisoEstado = `<div class="aviso-estado"><span>Bot en pausa${c.pausadoHasta ? ' hasta ' + esc(diaLargo(c.pausadoHasta).toLowerCase() === 'hoy' ? soloHora(c.pausadoHasta) : diaLargo(c.pausadoHasta) + ' ' + soloHora(c.pausadoHasta)) : ''}</span><button class="boton principal" data-chat-accion="activar">Que conteste el bot</button></div>`
    else if (c.estado === 'pide_info') avisoEstado = `<div class="aviso-estado humano"><span><b>Pide información.</b> Ya era un chat tuyo, por eso el bot no le contestó.</span><button class="boton principal" data-chat-accion="activar">Que conteste el bot</button></div>`
    else if (c.estado === 'humano') avisoEstado = `<div class="aviso-estado humano"><span><b>Te toca a ti.</b> El bot ya no contesta aquí.</span><button class="boton" data-chat-accion="activar">Devolver al bot</button></div>`
    else avisoEstado = `<div class="aviso-estado"><span>El bot ignora este chat</span><button class="boton principal" data-chat-accion="activar">Que conteste el bot</button></div>`

    let ultimoDia = ''
    const mensajes = c.historial.map(m => {
      const dia = diaClave(new Date(m.t))
      const sep = dia !== ultimoDia ? `<div class="dia-sep">${esc(diaLargo(m.t))}</div>` : ''
      ultimoDia = dia
      const quien = m.rol === 'bot' ? '<span class="quien">Bot</span>' : m.rol === 'tomas' ? '<span class="quien">Tú</span>' : ''
      return `${sep}<div class="msg ${esc(m.rol)}">${quien}${esc(m.texto)}<span class="meta">${esc(soloHora(m.t))}</span></div>`
    }).join('')

    const citas = datos.citas.filter(x => x.estado === 'agendada')
    vista.innerHTML = `
      <div class="chat-cabeza"><div class="chat-top">
        <a class="atras" href="#/chats" aria-label="Volver a chats"><svg width="12" height="20" viewBox="0 0 12 20" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 2 2 10l8 8"/></svg>Chats</a>
        <div class="cuerpo"><div class="nombre">${esc(nombreDe(c))}</div><div class="suave pequeno">${[c.telefono ? '+' + esc(c.telefono) : '', c.zonaNombre ? esc(c.zonaNombre) : '', c.lugar ? esc(c.lugar) : ''].filter(Boolean).join(' · ')}</div></div>
        <button class="mas" id="mas" aria-label="Más opciones">•••</button>
      </div>
      ${avisoEstado}</div>
      ${c.anuncio || c.origen ? `<div class="suave pequeno" style="margin:-4px 0 10px">${c.origen === 'anuncio' ? 'Llegó por el anuncio' + (c.anuncio ? ': ' + esc(c.anuncio) : '') : 'Llegó por: ' + esc(c.origen)}${c.crm ? ' · enviado al CRM' : ''}</div>` : ''}
      ${citas.length ? `<div class="lista" style="margin-bottom:12px">${citas.map(filaCita).join('')}</div>` : ''}
      <div class="mensajes">${mensajes || '<div class="vacio">Sin mensajes guardados.</div>'}</div>
      <div class="redactar">
        <div class="nota">Si escribes aquí, el bot se pausa en este chat.</div>
        <form id="form-enviar"><textarea id="texto" rows="1" placeholder="Escribe como Tomás…" aria-label="Mensaje"></textarea>
        <button class="enviar" id="btn-enviar" aria-label="Enviar" disabled><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M3.4 20.4 21 12 3.4 3.6 3.4 10l12 2-12 2z"/></svg></button></form>
      </div>`
    vista.style.paddingBottom = 'calc(var(--abajo) + 130px)'

    const ta = $('#texto'), btn = $('#btn-enviar')
    ta.value = borrador
    if (escribiendo) ta.focus()
    const ajustar = () => { ta.style.height = 'auto'; ta.style.height = Math.min(ta.scrollHeight, 140) + 'px'; btn.disabled = !ta.value.trim() }
    ajustar()
    ta.addEventListener('input', ajustar)
    $('#form-enviar').addEventListener('submit', async (e) => {
      e.preventDefault()
      const texto = ta.value.trim(); if (!texto) return
      btn.disabled = true
      try { await api('/api/enviar', { id: c.id, texto }); ta.value = ''; firmaChat = ''; await verChat(id) } catch (err) { aviso('No se envió: ' + err.message); btn.disabled = false }
    })
    $('#mas').addEventListener('click', () => {
      const ops = []
      if (c.telefono) ops.push({ texto: 'Abrir en WhatsApp', href: 'https://wa.me/' + c.telefono })
      if (c.estado !== 'prospecto') ops.push({ texto: 'Que conteste el bot', accion: () => accionChat(c.id, 'activar') })
      if (c.estado === 'prospecto') ops.push({ texto: 'Pausar el bot aquí', accion: () => accionChat(c.id, 'pausar') })
      if (c.estado !== 'conocido') ops.push({ texto: 'Ignorar este chat', rojo: true, accion: () => accionChat(c.id, 'ignorar', true) })
      hoja(ops)
    })
    if (pegadoAbajo) requestAnimationFrame(() => scrollTo(0, document.body.scrollHeight))
  }

  async function verCitas () {
    const { citas } = await api('/api/citas')
    const ahora = Date.now()
    const vigentes = citas.filter(c => c.estado === 'agendada')
    const proximas = vigentes.filter(c => Date.parse(c.fin) > ahora)
    const pasadas = vigentes.filter(c => Date.parse(c.fin) <= ahora).reverse()
    vista.innerHTML = `
      ${cabecera('Citas', 'Citas agendadas por Sofía.')}
      <div class="lista">${proximas.length ? proximas.map(filaCita).join('') : '<div class="vacio">No hay demostraciones próximas.</div>'}</div>
      ${pasadas.length ? `<h2 class="seccion">Anteriores</h2><div class="lista">${pasadas.slice(0, 30).map(filaCita).join('')}</div>` : ''}`
  }

  async function verAjustes () {
    estado = await api('/api/estado'); zona = estado.zona || zona
    const w = estado.wa
    const instalada = navigator.standalone || matchMedia('(display-mode: standalone)').matches
    let bloqueWA
    if (w.conectado) {
      bloqueWA = `<div class="ajuste"><div><div class="nombre">WhatsApp conectado</div><div class="suave pequeno">+${esc(w.numero)} · desde ${esc(horaCorta(w.desde))}</div></div><span class="punto ok"></span></div>
        <div class="ajuste"><div class="suave pequeno">Desvincula si quieres usar otro número.</div><button class="boton peligro" id="desvincular">Desvincular</button></div>`
    } else if (w.codigo || w.qr) {
      bloqueWA = `<div style="padding:14px 16px 0"><div class="nombre alerta">Falta vincular WhatsApp</div></div>
        ${w.codigo ? `<div class="codigo">${esc(w.codigo)}</div>
        <ol class="pasos"><li>Abre WhatsApp Business en tu iPhone.</li><li>Ajustes → Dispositivos vinculados → Vincular un dispositivo.</li><li>Toca “Vincular con el número de teléfono” y escribe este código.</li></ol>` : ''}
        ${w.qr ? `<details style="padding:0 16px 14px"><summary class="pequeno">O escanear QR desde otro teléfono</summary><img src="${w.qr}" width="240" height="240" alt="Código QR" style="margin-top:10px"></details>` : ''}`
    } else {
      bloqueWA = `<div class="ajuste"><div><div class="nombre espera">Conectando con WhatsApp…</div><div class="suave pequeno">${esc(w.error)}</div></div></div>`
    }
    vista.innerHTML = `
      ${cabecera('Ajustes', 'El bot, la conexión con WhatsApp y la app.')}
      <div class="lista">
        <div class="ajuste"><div><div class="nombre">Bot encendido</div><div class="suave pequeno">${estado.botActivo ? 'Contesta a los prospectos nuevos' : 'No contesta a nadie'}</div></div>
          <button class="interruptor" role="switch" aria-checked="${estado.botActivo}" aria-label="Bot encendido" id="interruptor"></button></div>
      </div>
      <h2 class="seccion">WhatsApp</h2>
      <div class="lista">${bloqueWA}</div>
      ${instalada ? '' : `<h2 class="seccion">Instalar en tu pantalla de inicio</h2>
      <div class="lista"><ol class="pasos" style="padding-top:14px"><li>Abre esta página en Safari.</li><li>Toca el botón Compartir.</li><li>Elige “Agregar a pantalla de inicio”.</li><li>Abre la app desde el ícono y entra con tu clave una vez.</li></ol></div>`}
      <h2 class="seccion">Cambiar cómo habla Sofía</h2>
      <div class="lista"><div class="ajuste"><div class="suave pequeno">Los horarios, la oferta y el estilo se editan en GitHub: <b>negocio.md</b>, <b>estilo.md</b> y <b>ajustes.json</b>.</div></div></div>
      <div style="margin-top:28px;text-align:center"><a class="boton" href="/salir">Cerrar sesión</a></div>`
    $('#interruptor').addEventListener('click', async (e) => {
      const nuevo = e.currentTarget.getAttribute('aria-checked') !== 'true'
      e.currentTarget.setAttribute('aria-checked', String(nuevo))
      try { await api('/api/accion', { accion: nuevo ? 'bot_on' : 'bot_off' }); aviso(nuevo ? 'Bot encendido' : 'Bot apagado'); verAjustes() } catch (err) { aviso(err.message); verAjustes() }
    })
    $('#desvincular')?.addEventListener('click', () => hoja([{ texto: 'Desvincular WhatsApp', rojo: true, accion: async () => { await api('/api/accion', { accion: 'desvincular' }); aviso('WhatsApp desvinculado'); setTimeout(verAjustes, 1500) } }]))
  }

  async function accionChat (id, accion, volver) {
    try {
      await api('/api/accion', { accion, id })
      aviso({ activar: 'El bot contestará este chat', pausar: 'Bot en pausa en este chat', ignorar: 'Chat ignorado' }[accion])
      firmaChat = ''
      if (volver) location.hash = '#/chats'; else render(true)
    } catch (e) { aviso(e.message) }
  }

  function insignia () {
    const n = estado?.resumen?.teToca || 0
    const el = $('#insignia')
    el.hidden = !n; el.textContent = n
  }

  // ---------- navegación ----------
  function ruta () {
    const h = location.hash.replace(/^#\/?/, '')
    const [tab, ...resto] = h.split('/')
    return { tab: tab || 'inicio', id: resto.length ? decodeURIComponent(resto.join('/')) : null }
  }

  async function render (refresco) {
    const { tab, id } = ruta()
    const enChat = tab === 'chat'
    $('#pestanas').hidden = enChat
    if (!enChat) vista.style.paddingBottom = ''
    document.querySelectorAll('.pestanas a').forEach(a => a.setAttribute('aria-current', a.dataset.tab === tab ? 'page' : 'false'))
    try {
      if (tab === 'chats') await verChats()
      else if (enChat && id) await verChat(id, refresco)
      else if (tab === 'citas') await verCitas()
      else if (tab === 'ajustes') { if (!refresco || !estado?.wa?.conectado) await verAjustes() }
      else await verInicio()
      if (tab !== 'inicio' && tab !== 'ajustes' && !refresco) api('/api/estado').then(e => { estado = e; zona = e.zona || zona; insignia() }).catch(() => {})
    } catch (e) {
      if (!refresco) vista.innerHTML = `<div class="vacio">No se pudo cargar: ${esc(e.message)}. <button class="boton" onclick="location.reload()">Reintentar</button></div>`
    }
  }

  vista.addEventListener('click', (e) => {
    const f = e.target.closest('[data-filtro]')
    if (f) { filtro = f.dataset.filtro; render(); return }
    const fz = e.target.closest('[data-zona]')
    if (fz) { filtroZona = fz.dataset.zona; render(); return }
    const a = e.target.closest('[data-chat-accion]')
    if (a) { accionChat(ruta().id, a.dataset.chatAccion); return }
    const b = e.target.closest('[data-bot]')
    if (b) api('/api/accion', { accion: 'bot_on' }).then(() => { aviso('Bot encendido'); render() })
  })

  addEventListener('hashchange', () => { firmaChat = ''; scrollTo(0, 0); render() })

  // refresco automático cada 5 s (solo con la app visible y sin escribir en ajustes)
  setInterval(() => {
    if (document.hidden || capa.innerHTML) return
    const { tab } = ruta()
    if (tab === 'ajustes' && estado?.wa?.conectado) return
    render(true)
  }, 5000)
  document.addEventListener('visibilitychange', () => { if (!document.hidden) render(true) })

  render()
})()
</script>
</body>
</html>
